name: Research LMMSE fixed Python 3.11 A-B-A

on:
  push:
    branches:
      - research/lmmse-python311-only-aba-2026-11-17
    paths:
      - research/experiments/compare_lmmse_matched_host.py
      - research/experiments/replay_lmmse_cases.py
      - research/fixtures/lmmse_tensor_replay_v1.json
      - .github/workflows/research-lmmse-python311-only-aba.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aba:
    name: Same Python 3.11 / same VM (Torch 2.9.1 -> 2.10.0 -> 2.9.1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: src:research/experiments
      SIONNA_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_DYNAMIC: "FALSE"
      OMP_DYNAMIC: "FALSE"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create isolated A (Torch 2.9.1)
        run: |
          python -m venv .venv_a
          .venv_a/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            torch==2.9.1 --index-url https://download.pytorch.org/whl/cpu
          .venv_a/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" "scipy==1.16.3" "h5py==3.15.1" \
            "matplotlib==3.10.8" "importlib-resources==6.5.2" "mpmath==1.3.0"
      - name: Create isolated B (Torch 2.10.0) with the SAME Python
        run: |
          python -m venv .venv_b
          .venv_b/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          .venv_b/bin/python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy==2.3.5" "scipy==1.16.3" "h5py==3.15.1" \
            "matplotlib==3.10.8" "importlib-resources==6.5.2" "mpmath==1.3.0"
      - name: Capture host and runtime provenance
        run: |
          mkdir -p research/results/python311_aba
          git rev-parse HEAD > research/results/python311_aba/source_commit.txt
          uname -a > research/results/python311_aba/uname.txt
          lscpu > research/results/python311_aba/lscpu.txt
          lscpu -J > research/results/python311_aba/lscpu.json
          sha256sum /proc/cpuinfo > research/results/python311_aba/cpuinfo_sha256.txt
          grep -m 1 'model name' /proc/cpuinfo > research/results/python311_aba/cpu_model.txt || true
          .venv_a/bin/python -c 'import sys,torch,numpy,scipy,mpmath;print(sys.version,torch.__version__,numpy.__version__,scipy.__version__,mpmath.__version__,torch.backends.cpu.get_cpu_capability());print(torch.__config__.show())' > research/results/python311_aba/backend_a.txt
          .venv_b/bin/python -c 'import sys,torch,numpy,scipy,mpmath;print(sys.version,torch.__version__,numpy.__version__,scipy.__version__,mpmath.__version__,torch.backends.cpu.get_cpu_capability());print(torch.__config__.show())' > research/results/python311_aba/backend_b.txt
          cat research/results/python311_aba/cpu_model.txt
          cat research/results/python311_aba/backend_a.txt
          cat research/results/python311_aba/backend_b.txt
      - name: Replay A1 -> B -> A2 on one VM and same Python minor version
        run: |
          .venv_a/bin/python research/experiments/replay_lmmse_cases.py \
            --fixtures research/fixtures/lmmse_tensor_replay_v1.json \
            --output research/results/python311_aba/a1.json --repeats 3
          .venv_b/bin/python research/experiments/replay_lmmse_cases.py \
            --fixtures research/fixtures/lmmse_tensor_replay_v1.json \
            --output research/results/python311_aba/b.json --repeats 3
          .venv_a/bin/python research/experiments/replay_lmmse_cases.py \
            --fixtures research/fixtures/lmmse_tensor_replay_v1.json \
            --output research/results/python311_aba/a2.json --repeats 3
      - name: Compare frozen bytes, numeric deltas and failure classes
        run: |
          .venv_a/bin/python research/experiments/compare_lmmse_matched_host.py \
            --a1 research/results/python311_aba/a1.json \
            --b research/results/python311_aba/b.json \
            --a2 research/results/python311_aba/a2.json \
            --output research/results/python311_aba/comparison.json
      - name: Preserve complete matched-host raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmmse-python311-fixed-aba-evidence
          path: research/results/python311_aba
          if-no-files-found: warn
          retention-days: 30
