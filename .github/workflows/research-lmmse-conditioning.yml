name: Research LMMSE conditioning adversarial sweep

on:
  push:
    branches:
      - research/lmmse-conditioning-audit-2026-11-17
    paths:
      - research/experiments/lmmse_conditioning_sweep.py
      - research/tests/test_lmmse_receiver_frame.py
      - .github/workflows/research-lmmse-conditioning.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: LMMSE conditioning (Python ${{ matrix.py }}, Torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: "3.11"
            torch: "2.9.1"
          - py: "3.13"
            torch: "2.10.0"
    env:
      PYTHONPATH: src
      SIONNA_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.py }}"
      - name: Install CPU numerical and oracle dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=2.2.6" "scipy>=1.15.3" "h5py>=3.15.1" \
            "matplotlib>=3.10.8" "importlib-resources>=6.5.2" pytest mpmath
      - name: Show exact source and runtime
        run: |
          git rev-parse HEAD
          python -c 'import sys, torch, mpmath; print(sys.version); print(torch.__version__); print(mpmath.__version__)'
      - name: Run previously validated LMMSE regression
        run: |
          python -m pytest research/tests/test_lmmse_receiver_frame.py -q
      - name: Adversarial conditioning sweep and preregistered safe gate
        run: |
          python research/experiments/lmmse_conditioning_sweep.py \
            --output research/results/lmmse_conditioning_python_${{ matrix.py }}.json
      - name: Preserve all raw cases even on sweep failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lmmse-conditioning-python-${{ matrix.py }}
          path: research/results/lmmse_conditioning_python_${{ matrix.py }}.json
          if-no-files-found: warn
          retention-days: 30
