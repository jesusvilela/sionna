name: Research LMMSE fixed-Python audit archive

on:
  push:
    branches:
      - research/lmmse-python311-only-aba-2026-11-17
    paths:
      - research/LMMSE_PYTHON311_TORCH_ABA_AUDIT_2026-11-17.md
      - research/LMMSE_PYTHON311_TORCH_ABA_MANIFEST_2026-11-17.json
      - .github/workflows/research-lmmse-python311-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest JSON and source identity
        run: |
          python -m json.tool research/LMMSE_PYTHON311_TORCH_ABA_MANIFEST_2026-11-17.json > /dev/null
          sha256sum research/LMMSE_PYTHON311_TORCH_ABA_MANIFEST_2026-11-17.json
          sha256sum research/LMMSE_PYTHON311_TORCH_ABA_AUDIT_2026-11-17.md
      - name: Preserve exact manifest and audit text
        uses: actions/upload-artifact@v4
        with:
          name: lmmse-python311-audit
          path: |
            research/LMMSE_PYTHON311_TORCH_ABA_MANIFEST_2026-11-17.json
            research/LMMSE_PYTHON311_TORCH_ABA_AUDIT_2026-11-17.md
          retention-days: 30
