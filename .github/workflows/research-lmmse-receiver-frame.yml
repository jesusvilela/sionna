name: Research LMMSE receiver-frame invariance

on:
  push:
    branches:
      - research/lmmse-receiver-frame-invariance-2026-11-17
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu:
    name: LMMSE frame invariant (Python ${{ matrix.py }}, Torch ${{ matrix.torch }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - py: "3.11"
            torch: "2.9.1"
          - py: "3.13"
            torch: "2.10.0"
    env:
      PYTHONPATH: src
      SIONNA_DEVICE: cpu
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.py }}"
      - name: Install CPU numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            torch==${{ matrix.torch }} --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "numpy>=2.2.6" "scipy>=1.15.3" "h5py>=3.15.1" \
            "matplotlib>=3.10.8" "importlib-resources>=6.5.2" pytest
      - name: Check source revision and runtime
        run: |
          git rev-parse HEAD
          python -c 'import sys, torch; print(sys.version); print(torch.__version__)'
      - name: Validate independent LMMSE receiver-frame tests
        run: |
          python -m pytest research/tests/test_lmmse_receiver_frame.py -v -q
      - name: Check existing upstream LMMSE smoke tests
        run: |
          python -m pytest test/unit/mimo/test_mimo_equalization.py \
            --device=cpu \
            -k 'test_lmmse_equalizer_shape or test_lmmse_matrix_shape' -q
